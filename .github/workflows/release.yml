name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-node:
    name: build node (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Set up zig (needed by --cross-compile's cargo-zigbuild backend)
        if: ${{ matrix.cross }}
        uses: mlugg/setup-zig@v2
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: npx napi build --platform --release --features node --target ${{ matrix.target }}
      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: npx napi build --platform --release --features node --target ${{ matrix.target }} --cross-compile
      - uses: actions/upload-artifact@v4
        with:
          name: node-bindings-${{ matrix.target }}
          path: divot.*.node

  publish-npm:
    name: Publish to npm
    needs: build-node
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          pattern: node-bindings-*
          path: artifacts
      - name: Organize per-platform npm packages
        run: npx napi artifacts --npm-dir npm
      - name: Sync per-platform package versions
        run: npx napi version
      - name: Reconcile root package + create GitHub release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx napi pre-publish --npm-dir npm --tag-style npm --skip-optional-publish
      - name: Publish per-platform packages (staggered -- publishing all 5 back-to-back
          previously tripped npm's spam-detection heuristic on the last one)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version -- already published"
            else
              (cd "$dir" && npm publish)
            fi
            sleep 20
          done
      - name: Publish root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

  build-wheels:
    name: wheels (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --release --out dist --features python
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            args: --release --out dist --features python
          - os: macos-latest
            target: universal2-apple-darwin
            args: --release --out dist --features python
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --release --out dist --features python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
