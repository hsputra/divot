name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --verbose

  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest runners are arm64 -- x86_64-apple-darwin is a
          # cross build there (can't load an x64 .node into an arm64
          # Node process in-process), aarch64-apple-darwin is native.
          - host: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Set up zig (needed by --cross-compile's cargo-zigbuild backend)
        if: ${{ matrix.cross }}
        uses: mlugg/setup-zig@v2
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: npx napi build --platform --release --features node --target ${{ matrix.target }}
      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: npx napi build --platform --release --features node --target ${{ matrix.target }} --cross-compile
      - name: Test (native targets only -- can't load a cross-arch .node in-process)
        if: ${{ !matrix.cross }}
        run: node --test
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: divot.*.node
