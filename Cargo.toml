[package]
name = "divot"
version = "0.1.0"
edition = "2024"
description = "Fast diff/patch engine, in Rust, with Node.js and Python bindings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hsputra/divot"
readme = "README.md"
keywords = ["diff", "patch", "text", "myers", "histogram"]
categories = ["algorithms", "text-processing"]
exclude = [
    "npm/",
    "plots/",
    "scripts/",
    "test/",
    "tests/",
    ".github/",
    "package.json",
    "package-lock.json",
]

[lib]
name = "divot"
crate-type = ["cdylib", "rlib"]

[dependencies]
imara-diff = { version = "0.2", features = ["unified_diff"] }
napi = { version = "3.12.0", optional = true, features = ["napi4"] }
napi-derive = { version = "3.6.2", optional = true }
pyo3 = { version = "0.29.2", features = ["abi3-py38"], optional = true }
rayon = "1.12.0"

[features]
node = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
python = ["dep:pyo3", "pyo3/extension-module"]

[build-dependencies]
napi-build = { version = "2.4.0", optional = true }
